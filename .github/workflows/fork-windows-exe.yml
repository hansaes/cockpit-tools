name: "🪟 Fork Windows EXE"

run-name: "🪟 Windows EXE · ${{ github.ref_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"

concurrency:
  group: fork-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tauri lib test binaries cannot start on Windows runners; upstream tests Rust on Ubuntu too.
  rust-tests:
    name: "🧪 History and project repair tests"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐧 Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libnm-dev patchelf

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 🧪 Run tests
        working-directory: src-tauri
        run: |
          cargo test history_projection_repair --lib
          cargo test codex_local_project_recovery --lib

  build-windows:
    name: "🏗️ Build: Windows (unsigned)"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🔄 Sync versions
        run: npm run sync-version


      - name: 🏗️ Build Windows app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Forks have no updater signing key, so skip updater artifacts.
          npx tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 📤 Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/cockpit-tools.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi